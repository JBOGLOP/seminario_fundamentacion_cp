<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tablero del seminario · uso docente</title>
<meta name="robots" content="noindex,nofollow">

<!-- ===========================================================================
     TABLERO DOCENTE — se abre en clase y la clase se construye con él.

     Sirve para las siete sesiones: se elige arriba. Lee las entregas del
     Apps Script y las muestra pregunta por pregunta, que es como se conduce
     la sesión: se proyecta lo que el grupo escribió y se contrasta.

     ⚠️ ESTA PÁGINA NECESITA EL TOKEN DE LECTURA (DASH_TOKEN), que NO está
     aquí ni puede estarlo: esto vive en un repositorio público. Se pone en
     `config.js`, que está en .gitignore, o se teclea al abrir y no se guarda.

     MODO PROYECCIÓN. Oculta nombres y correos y deja solo el seudónimo. Es lo
     que se enchufa al proyector. Enciéndalo ANTES de compartir pantalla.
     =========================================================================== -->

<style>
:root{
  --bosque:#2F5D50;    --bosque-dark:#234639;    --bosque-deep:#17302A;  --bosque-soft:#D6E3DD;
  --arcilla:#C4714F;   --arcilla-dark:#A2563A;   --arcilla-deep:#6F3823; --arcilla-soft:#F3DCD1;
  --malva:#7A5C8A;     --malva-dark:#5F4570;     --malva-deep:#402C4D;   --malva-soft:#E4DAEA;
  --piedra:#8A8578;    --piedra-dark:#6B6659;    --piedra-deep:#4E4A40;  --piedra-soft:#EFEBE3;
  --pizarra:#22282A;   --gris:#565E5C;           --gris-claro:#9AA09D;
  --blanco:#FFFFFF;    --lino:#FAF8F4;
  --shadow-soft:0 2px 8px rgba(34,40,42,.07);
  --shadow-medium:0 6px 20px rgba(34,40,42,.11);
  --radius:14px; --radius-sm:9px;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;
  --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
  --serif:Georgia,'Times New Roman',serif;

  /* Transversal → piedra */
  --acento:var(--piedra); --acento-dark:var(--piedra-deep); --acento-soft:var(--piedra-soft);
  --escala:1;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:var(--sans);color:var(--pizarra);background:var(--lino);line-height:1.6}
:focus-visible{outline:3px solid var(--acento);outline-offset:2px}
.envoltura{max-width:74rem;margin:0 auto;padding:0 1.1rem}

/* ── Barra superior ─────────────────────────────────────────────── */
.barra{background:var(--pizarra);color:var(--lino);padding:.6rem 0;position:sticky;top:0;z-index:30;
  box-shadow:var(--shadow-medium)}
.barra .envoltura{display:flex;flex-wrap:wrap;align-items:center;gap:.55rem}
.barra__t{font-weight:700;font-size:.92rem;margin-right:auto}
.barra__t small{display:block;font-weight:400;font-size:.74rem;color:var(--gris-claro)}
select,.barra button,.barra input{font:inherit;font-size:.82rem;border-radius:999px;padding:.32rem .85rem;
  border:1px solid rgba(255,255,255,.3);background:transparent;color:var(--lino);cursor:pointer}
select option{color:var(--pizarra)}
.barra button:hover{background:rgba(255,255,255,.14)}
.barra button.on{background:var(--piedra);color:var(--pizarra);border-color:var(--piedra);font-weight:700}
.cuentas{font-family:var(--mono);font-size:.8rem;color:var(--piedra-soft);white-space:nowrap}

/* ── Aviso de conexión / token ──────────────────────────────────── */
.aviso{border-radius:var(--radius);padding:1rem 1.2rem;margin:1.2rem 0;background:var(--blanco);
  box-shadow:var(--shadow-soft);border-left:4px solid var(--gris-claro);max-width:60ch}
.aviso--malo{border-left-color:var(--arcilla);background:var(--arcilla-soft);color:var(--arcilla-dark)}
.aviso--ok{border-left-color:var(--bosque);background:var(--bosque-soft)}
.aviso strong{display:block;margin-bottom:.25rem;color:var(--pizarra)}
.aviso input{width:100%;font:inherit;padding:.5rem .7rem;border:1px solid #C9C4BA;border-radius:var(--radius-sm);
  margin-top:.6rem;background:var(--blanco);color:var(--pizarra);border-radius:var(--radius-sm)}
.aviso button{font:inherit;font-weight:600;margin-top:.6rem;cursor:pointer;border-radius:999px;
  padding:.45rem 1.2rem;border:1px solid var(--acento-dark);background:var(--acento-dark);color:var(--blanco)}

/* ── Navegador de preguntas ─────────────────────────────────────── */
.preguntas{display:flex;flex-wrap:wrap;gap:.5rem;margin:1.3rem 0 .4rem}
.preguntas button{font:inherit;font-weight:700;cursor:pointer;border-radius:999px;padding:.45rem 1.1rem;
  border:1px solid var(--acento);background:var(--blanco);color:var(--acento-dark);font-size:.9rem}
.preguntas button:hover{background:var(--acento-soft)}
.preguntas button.activa{background:var(--acento-dark);color:var(--blanco);border-color:var(--acento-dark)}
.preguntas button .n{font-family:var(--mono);font-size:.72rem;opacity:.75;margin-left:.35rem}

.titulo-pregunta{font-size:calc(1.25rem * var(--escala));margin:.8rem 0 .2rem;line-height:1.25}
.sub{color:var(--gris);font-size:.88rem;margin:0 0 1rem}

/* ── Respuestas ─────────────────────────────────────────────────── */
.respuestas{display:grid;gap:.9rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,26rem),1fr));
  padding-bottom:3rem}
.tarjeta{background:var(--blanco);border-radius:var(--radius);padding:1rem 1.15rem;
  box-shadow:var(--shadow-soft);border-left:4px solid var(--acento);display:flex;flex-direction:column}
.tarjeta.leida{border-left-color:var(--gris-claro);opacity:.62}
.tarjeta__cab{display:flex;align-items:center;gap:.6rem;margin-bottom:.55rem;flex-wrap:wrap}
.seudo{font-family:var(--mono);font-weight:700;font-size:1rem;background:var(--acento-soft);
  color:var(--acento-dark);border-radius:var(--radius-sm);padding:.1rem .6rem;flex-shrink:0}
.quien{font-size:.82rem;color:var(--gris);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.marca{font:inherit;font-size:.74rem;cursor:pointer;border-radius:999px;padding:.15rem .65rem;
  border:1px solid var(--gris-claro);background:transparent;color:var(--gris);flex-shrink:0}
.marca:hover{background:var(--piedra-soft)}
.tarjeta__txt{font-size:calc(.95rem * var(--escala));white-space:pre-wrap;word-wrap:break-word;margin:0;
  font-family:var(--serif);line-height:1.55}
.tarjeta__pie{font-family:var(--mono);font-size:.72rem;color:var(--gris-claro);margin:.7rem 0 0}
.vacia{color:var(--gris-claro);font-style:italic;font-family:var(--sans)}

/* ── Lectura: plegado, resaltado, señales y citas ───────────────── */
.tarjeta__txt{position:relative}
.tarjeta__txt.plegado{max-height:10em;overflow:hidden}
.tarjeta__txt.plegado::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3.4em;
  background:linear-gradient(rgba(255,255,255,0),var(--blanco))}
.desplegar{font:inherit;font-size:.76rem;cursor:pointer;border:0;background:none;padding:.45rem 0 0;
  color:var(--acento-dark);font-weight:700;text-align:left;align-self:flex-start}
.desplegar:hover{text-decoration:underline}

/* El resaltado no decora: marca lo que se busca al conducir la sesión. */
mark{background:none;padding:0 .1em;border-radius:3px}
mark.r-aus{background:var(--arcilla-soft);color:var(--arcilla-deep);font-weight:700}
mark.r-num{background:var(--piedra-soft);color:var(--piedra-deep);font-weight:700}
mark.r-fue{background:var(--bosque-soft);color:var(--bosque-dark)}

.senales{display:flex;flex-wrap:wrap;gap:.5rem;margin:0 0 1.1rem}
.senal{font-size:.78rem;border-radius:999px;padding:.26rem .85rem;background:var(--blanco);
  box-shadow:var(--shadow-soft);border:1px solid rgba(34,40,42,.08);color:var(--gris)}
.senal b{font-family:var(--mono);color:var(--pizarra)}
.senal--aus{background:var(--arcilla-soft);color:var(--arcilla-deep);border-color:var(--arcilla)}
.senal--aus b{color:var(--arcilla-deep)}

/* --- Sintesis de maquina (Ollama en local) -------------------------------
   Deliberadamente con aire de borrador: fondo de aviso y etiqueta visible.
   Lo que sale de un modelo no puede parecerse a lo que escribio una persona. */
.ollama{background:var(--arcilla-soft); border:1px dashed var(--arcilla);
  border-radius:var(--radius); padding:1rem 1.2rem; margin:0 0 1.3rem}
.ollama h2{font-size:.8rem; margin:0 0 .3rem; color:var(--arcilla-deep);
  letter-spacing:.06em; text-transform:uppercase}
.ollama .ollama__nota{font-size:.82rem; color:var(--arcilla-deep); margin:0 0 .9rem}
.ollama .ollama__estado{font-family:var(--mono); font-size:.76rem; color:var(--gris)}
.ollama .ficha{border-top:1px solid rgba(196,113,79,.28); padding:.75rem 0 0; margin:.75rem 0 0}
.ollama .ficha:first-of-type{border-top:0; margin-top:0}
.ollama .ficha__seudo{font-family:var(--mono); font-weight:700; font-size:.8rem;
  color:var(--arcilla-deep); margin:0 0 .25rem}
.ollama .ficha p{margin:.2rem 0; font-size:calc(.95rem * var(--escala)); line-height:1.5}
.ollama .ficha .etq{font-size:.72rem; text-transform:uppercase; letter-spacing:.05em;
  color:var(--gris); margin-right:.4rem}
.ollama blockquote{font-family:var(--serif); margin:.45rem 0 0; padding-left:.9rem;
  border-left:3px solid var(--arcilla); font-size:calc(1rem * var(--escala)); line-height:1.45}
.ollama .verificada{font-size:.72rem; color:var(--gris)}
.ollama .descartada{font-size:.8rem; color:var(--arcilla-deep)}
.ollama button{font:inherit; font-size:.78rem; cursor:pointer; border:1px solid var(--arcilla);
  background:var(--blanco); color:var(--arcilla-deep); border-radius:999px; padding:.18rem .8rem;
  margin-left:.5rem}
.ollama button:hover{background:var(--arcilla); color:var(--blanco)}

/* El resumen POR RESPUESTA nunca se proyecta: es una parafrasis de maquina
   sobre alguien identificable. El modo proyeccion lo esconde, igual que
   esconde los nombres. */
body.proyeccion .ollama,body.proyeccion #resumir{display:none}
@media print{.ollama{display:none}}

/* --- Sintesis DEL GRUPO · esta si se proyecta ------------------------------
   Junta todas las respuestas de una pregunta y no distingue a nadie: ni
   nombres ni letras. Es la vista pensada para el proyector (tecla S). */
.sintesis{display:none;margin:0 0 1.4rem}
body.vista-sintesis .sintesis{display:block}
body.vista-sintesis .respuestas,body.vista-sintesis .faltantes,
body.vista-sintesis .ollama,body.vista-sintesis .citas{display:none!important}
.sg-acciones{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin:0 0 1rem}
.sg-acciones button{font:inherit;font-size:.82rem;font-weight:600;cursor:pointer;border-radius:999px;
  padding:.3rem .85rem;border:1px solid var(--acento-dark);background:var(--blanco);color:var(--acento-dark)}
.sg-acciones button:hover{background:var(--acento-soft)}
.sg-acciones button.otra{border-color:var(--gris-claro);color:var(--gris)}
.sg-ideas{list-style:none;padding:0;margin:0;display:grid;gap:.6rem}
.sg-idea{background:var(--blanco);border-radius:var(--radius);box-shadow:var(--shadow-soft);
  border-left:4px solid var(--acento);padding:.75rem 1.05rem;font-size:calc(1.05rem * var(--escala));line-height:1.45}
.sg-peso{font-family:var(--mono);font-size:.76em;color:var(--acento-dark);background:var(--acento-soft);
  border-radius:999px;padding:.05rem .55rem;margin-left:.45rem;white-space:nowrap}
.sg-bloque{margin-top:1.1rem}
.sg-bloque h3{font-size:.72rem;font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;
  color:var(--gris);margin:0 0 .25rem}
.sg-bloque p{margin:.15rem 0;font-size:calc(1rem * var(--escala));line-height:1.5}
.sg-citas{list-style:none;padding:0;margin:.2rem 0;display:grid;gap:.45rem}
.sg-citas li{font-family:var(--serif);font-style:italic;border-left:3px solid var(--acento-soft);
  padding-left:.8rem;font-size:calc(1.02rem * var(--escala));line-height:1.45}
.sg-nombre{display:inline-block;font-family:var(--sans);font-style:normal;font-size:.72rem;font-weight:700;
  background:var(--arcilla-soft);color:var(--arcilla-deep);border-radius:999px;padding:.05rem .55rem;margin-left:.45rem}
.sg-meta{font-family:var(--mono);font-size:.74rem;color:var(--gris-claro);margin:1rem 0 0;line-height:1.5}
.sg-espera{color:var(--gris);font-size:.95rem}
/* En proyeccion desaparecen los mandos, las marcas de maquina y toda linea
   que repita un nombre propio de las respuestas. */
body.proyeccion .sg-acciones,body.proyeccion .sg-meta,body.proyeccion .no-proyectar{display:none!important}
@media print{.sg-acciones{display:none}}

.citas{background:var(--pizarra);color:var(--lino);border-radius:var(--radius);
  padding:1.1rem 1.3rem;margin:0 0 1.3rem}
.citas h2{font-size:.9rem;margin:0 0 .8rem;color:var(--piedra-soft);letter-spacing:.06em;text-transform:uppercase}
.citas blockquote{font-family:var(--serif);font-size:calc(1.08rem * var(--escala));margin:0 0 1rem;
  padding-left:1rem;border-left:3px solid var(--piedra);line-height:1.45}
.citas blockquote:last-child{margin-bottom:0}
.citas .de{display:block;font-family:var(--mono);font-size:.78rem;color:var(--piedra-soft);margin-top:.4rem}
.citas .quitar{font:inherit;font-size:.7rem;cursor:pointer;border:1px solid rgba(250,248,244,.28);
  background:none;color:var(--gris-claro);border-radius:999px;padding:.08rem .6rem;margin-left:.5rem}
.citas .quitar:hover{background:rgba(250,248,244,.12)}
#fijar{position:fixed;z-index:60;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;border:0;
  border-radius:999px;padding:.42rem 1.05rem;background:var(--bosque);color:var(--blanco);
  box-shadow:var(--shadow-medium);display:none}

/* En proyección se ocultan los botones, no las citas: son para proyectar. */
body.proyeccion .desplegar,body.proyeccion #fijar,body.proyeccion .citas .quitar{display:none}
/* …y la respuesta se despliega entera. El plegado sirve para que el docente
   recorra ocho tarjetas en su pantalla; en el proyector se lee todo. Y como
   el botón de desplegar no está, dejarla cortada sería peor que no plegarla. */
body.proyeccion .tarjeta__txt.plegado{max-height:none}
body.proyeccion .tarjeta__txt.plegado::after{content:none}

/* ── Panel lateral: quién falta (solo modo docente) ─────────────── */
.faltantes{background:var(--blanco);border-radius:var(--radius);padding:1rem 1.2rem;
  box-shadow:var(--shadow-soft);border-left:4px solid var(--piedra);margin:1.2rem 0;max-width:60ch}
.faltantes h2{font-size:1rem;margin:0 0 .5rem;color:var(--piedra-deep)}
.faltantes ul{margin:0;padding-left:1.1rem;font-size:.88rem;color:var(--gris);columns:2;column-gap:1.5rem}
.faltantes li{margin-bottom:.2rem;break-inside:avoid}

/* En proyección desaparece todo lo que identifica. */
body.proyeccion .quien,
body.proyeccion .faltantes,
body.proyeccion .tarjeta__pie,
body.proyeccion .marca{display:none}
body.proyeccion{background:var(--lino)}
body.proyeccion .tarjeta{box-shadow:var(--shadow-medium)}

.pie{color:var(--gris-claro);font-size:.8rem;padding:1.5rem 0 2.5rem;max-width:60ch}
@media print{.barra,.preguntas,.marca{display:none}}
</style>

<div class="barra">
  <div class="envoltura">
    <p class="barra__t">Tablero del seminario<small>Fundamentación en cuidados paliativos · 2026-II</small></p>
    <select id="sesion" aria-label="Sesión">
      <option value="S01">S01 · Historia y fundamentos</option>
      <option value="S02">S02 · Lineamientos y políticas</option>
      <option value="S03">S03 · Marco legal y barreras</option>
      <option value="S04">S04 · Modelos y telesalud</option>
      <option value="S05">S05 · Enfoques diferenciales</option>
      <option value="S06">S06 · Bioética</option>
      <option value="S07">S07 · Equipo y redes</option>
    </select>
    <span class="cuentas" id="cuentas">—</span>
    <button type="button" id="recargar" title="Volver a leer las entregas">Recargar</button>
    <button type="button" id="menos" title="Letra más pequeña">A−</button>
    <button type="button" id="mas" title="Letra más grande">A+</button>
    <button type="button" id="vistaSintesis" title="Ideas agrupadas de todo el grupo, sin autor · se puede proyectar (tecla S)">Síntesis del grupo</button>
    <button type="button" id="resumir" title="Resumen de cada respuesta con un modelo local · no se proyecta">Resumen por respuesta</button>
    <button type="button" id="proyeccion" title="Oculta nombres y correos">Modo proyección</button>
  </div>
</div>

<div class="envoltura">
  <div id="aviso" class="aviso" style="display:none"></div>
  <div id="faltantes" class="faltantes" style="display:none"></div>
  <div class="preguntas" id="preguntas"></div>
  <h1 class="titulo-pregunta" id="titulo">—</h1>
  <p class="sub" id="subtitulo"></p>
  <div class="senales" id="senales"></div>
  <section class="sintesis" id="sintesis" aria-label="Síntesis del grupo"></section>
  <section class="ollama" id="ollama" hidden aria-label="Resumen por respuesta"></section>
  <section class="citas" id="citas" style="display:none" aria-label="Citas fijadas"></section>
  <div class="respuestas" id="respuestas"></div>
  <p class="pie">
    Uso docente. Las respuestas contienen datos personales: no proyecte esta página sin activar
    el <strong>modo proyección</strong>, y no la comparta por pantalla compartida sin comprobarlo antes.
  </p>
</div>

<!-- config.js NO está en el repositorio (.gitignore): lleva el token de
     lectura. Si falta, el tablero lo pide por teclado y no lo guarda. -->
<button type="button" id="fijar">Fijar cita</button>

<script src="../config.js" onerror="void 0"></script>
<!-- Motor de síntesis compartido con scripts/resumir-entregas.js. Es un
     archivo local: el tablero sigue abriendo sin conexión. -->
<script src="sintesis-ia.js"></script>
<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var CFG = (window.CONFIG || {});
  var ENDPOINT = CFG.appsScriptURL || '';
  var DASH = CFG.dashToken || '';

  // Títulos legibles de cada pregunta. El servidor devuelve solo los ids
  // (p1, p2…), porque no sabe —ni tiene por qué— cómo se llaman.
  var TITULOS = {
    S01: {
      p1: '¿Cuándo llegaron los cuidados paliativos a donde usted trabaja?',
      p2: '¿Con qué definición trabaja realmente su institución?',
      p3: 'El dolor total, y qué haría falta para poder afirmarlo',
      p4: 'Qué mide un indicador, y qué no mide (fuente en inglés)',
      p5: 'Convierta una afirmación del material en algo investigable'
    },
    S02: {
      p1: '¿La norma llegó a algún documento de su servicio?',
      p2: 'Qué compromete de verdad la WHA67.19 (fuente en inglés)',
      p3: '¿Qué dicen el BID, la OCDE o la CEPAL sobre cuidado paliativo?',
      p4: 'Convierta un instrumento en una pregunta investigable'
    },
    S04: {
      p1: 'Desarme el modelo de atención donde usted trabaja · los siete componentes',
      p2: '¿A quién no vio el ensayo que todos citan? (Temel 2010, fuente en inglés)',
      p3: '¿Cuál de las cuatro categorías de telemedicina existe donde usted trabaja? (Res. 1644 de 2026)',
      p4: 'De la afirmación a la pregunta · eficacia frente a efectividad'
    },
    S05: {
      p1: 'Elija su pregunta y desarme el modelo que pone a prueba · ámbito y enfoque diferencial',
      p2: '¿Qué permite afirmar la evidencia sobre su modelo, y qué no? (fuente en inglés)',
      p3: '¿Con qué diseño y con qué dato se respondería su pregunta?'
    }
  };

  var datos = null, preguntaActiva = null;
  var sesion = (new URLSearchParams(location.search).get('sesion') || 'S01').toUpperCase();
  $('sesion').value = sesion;

  /* ── Marcas de «ya discutida» ────────────────────────────────────
     Viven solo en este navegador: son el rastro de por dónde va la
     clase, no un dato del curso.                                    */
  function claveMarca() { return 'SEM_CP_tablero_leidas_' + sesion; }
  function leidas() {
    try { return JSON.parse(localStorage.getItem(claveMarca()) || '{}'); }
    catch (err) { return {}; }
  }
  function alternarMarca(id) {
    var m = leidas();
    m[id] ? delete m[id] : m[id] = 1;
    try { localStorage.setItem(claveMarca(), JSON.stringify(m)); } catch (err) { /* sin persistencia */ }
    pintarRespuestas();
  }

  /* ── Resaltado ────────────────────────────────────────────────────
     Se construye con NODOS, nunca con innerHTML: el texto lo escribe un
     estudiante y podría contener etiquetas. textContent más <mark> creados
     a mano lo dejan inerte.

     No es decoración. Marca las tres cosas que se buscan al conducir:
     la ausencia de dato —que en este seminario es el hallazgo—, las cifras
     verificables y las señales de que hay una fuente detrás.            */
  var PATRONES = [
    ['r-aus', /(?:no\s+(?:encontr\w+|hay|existe\w*|aparece\w*|figura\w*|est[áa]\s+(?:document|registr)\w*|se\s+(?:encontr|report|registr|document)\w*|pude\s+\w+)|sin\s+(?:registro|datos?|informaci[óo]n|evidencia)\w*|ausencia\s+de\s+\w+|no\s+se\s+conoce)/gi],
    ['r-num', /(?:\d{1,3}(?:[.,]\d+)?\s?%|(?:19|20)\d{2}|\d{1,3}(?:[.,]\d{3})+|\b\d{3,}\b)/g],
    ['r-fue', /(?:seg[úu]n\s+\w+|p[áa]g(?:ina)?\.?\s*\d+|OCCP|OMS|WHO|IAHPC|OPS|WHPCA|Atlas|Ley\s+\d+|Resoluci[óo]n\s+\d+|Sentencia\s+[CT]-\d+|https?:\/\/\S+)/gi]
  ];

  function resaltar(texto) {
    var frag = document.createDocumentFragment(), hits = [];
    PATRONES.forEach(function (par) {
      var re = new RegExp(par[0] && par[1].source, par[1].flags), m;
      while ((m = re.exec(texto)) !== null) {
        if (m[0]) hits.push({ i: m.index, f: m.index + m[0].length, c: par[0] });
        if (m.index === re.lastIndex) re.lastIndex++;
      }
    });
    // Orden de aparición; si dos se solapan gana el que empieza antes, y a
    // igual inicio el más largo. El resto se descarta.
    hits.sort(function (a, b) { return a.i - b.i || b.f - a.f; });
    var pos = 0;
    hits.forEach(function (h) {
      if (h.i < pos) return;
      if (h.i > pos) frag.appendChild(document.createTextNode(texto.slice(pos, h.i)));
      var mk = document.createElement('mark');
      mk.className = h.c;
      mk.textContent = texto.slice(h.i, h.f);
      frag.appendChild(mk);
      pos = h.f;
    });
    if (pos < texto.length) frag.appendChild(document.createTextNode(texto.slice(pos)));
    return frag;
  }

  function palabras(t) { t = (t || '').trim(); return t ? t.split(/\s+/).length : 0; }
  var LIMITE_PLEGADO = 70;   // palabras antes de plegar la tarjeta

  /* ── Citas fijadas ────────────────────────────────────────────────
     Son literales por construcción: salen de seleccionar el texto tal como
     lo escribió la persona. Nada las parafrasea.                       */
  function claveCitas() { return 'SEM_CP_tablero_citas_' + sesion; }
  function citas() {
    try { return JSON.parse(localStorage.getItem(claveCitas()) || '[]'); }
    catch (err) { return []; }
  }
  function guardarCitas(lista) {
    try { localStorage.setItem(claveCitas(), JSON.stringify(lista)); } catch (err) { /* sin persistencia */ }
    pintarCitas();
  }
  function anadirCita(texto, seudo, pregunta) {
    var lista = citas();
    lista.push({ t: texto, s: seudo, p: pregunta });
    guardarCitas(lista);
  }

  function pintarCitas() {
    var el = $('citas');
    var lista = citas().filter(function (c) { return c.p === preguntaActiva; });
    if (!lista.length) { el.style.display = 'none'; return; }
    el.style.display = 'block';
    el.textContent = '';
    var h = document.createElement('h2');
    h.textContent = 'Citas fijadas · ' + lista.length;
    el.appendChild(h);
    lista.forEach(function (c) {
      var bq = document.createElement('blockquote');
      bq.appendChild(document.createTextNode('«' + c.t + '»'));
      var de = document.createElement('span');
      de.className = 'de';
      de.textContent = '— ' + c.s;
      var quitar = document.createElement('button');
      quitar.className = 'quitar';
      quitar.textContent = 'quitar';
      quitar.onclick = function () {
        guardarCitas(citas().filter(function (x) { return !(x.t === c.t && x.s === c.s && x.p === c.p); }));
      };
      de.appendChild(quitar);
      bq.appendChild(de);
      el.appendChild(bq);
    });
  }

  /* Botón flotante al seleccionar texto dentro de una tarjeta. */
  (function () {
    var btn = $('fijar');
    document.addEventListener('mouseup', function () {
      var sel = window.getSelection();
      var txt = sel ? String(sel).trim() : '';
      var nodo = sel && sel.anchorNode;
      var tarjeta = null;
      while (nodo && nodo !== document) {
        if (nodo.nodeType === 1 && nodo.classList && nodo.classList.contains('tarjeta')) { tarjeta = nodo; break; }
        nodo = nodo.parentNode;
      }
      if (!txt || txt.length < 15 || !tarjeta || document.body.classList.contains('proyeccion')) {
        btn.style.display = 'none';
        return;
      }
      var r = sel.getRangeAt(0).getBoundingClientRect();
      btn.style.display = 'block';
      btn.style.left = Math.max(8, Math.min(window.innerWidth - 130, r.left)) + 'px';
      btn.style.top = Math.max(8, r.top - 44) + 'px';
      btn.onclick = function () {
        anadirCita(txt, tarjeta.getAttribute('data-seudo') || '?', preguntaActiva);
        btn.style.display = 'none';
        sel.removeAllRanges();
      };
    });
    document.addEventListener('scroll', function () { btn.style.display = 'none'; }, true);
  })();

  /* ── Señales de la pregunta ───────────────────────────────────────
     Cuentan lo que importa antes de leer: cuántas reportan ausencia de
     dato, cuántas apoyan en fuente, y cuánto hay que leer.            */
  function pintarSenales() {
    var el = $('senales');
    el.textContent = '';
    if (!datos || !datos.entregas) return;

    var conTexto = datos.respuestas
      .map(function (r) { return String(r.respuestas[preguntaActiva] || '').trim(); })
      .filter(Boolean);
    if (!conTexto.length) return;

    var reAus = new RegExp(PATRONES[0][1].source, 'i');
    var reFue = new RegExp(PATRONES[2][1].source, 'i');
    var nAus = conTexto.filter(function (t) { return reAus.test(t); }).length;
    var nFue = conTexto.filter(function (t) { return reFue.test(t); }).length;
    var largos = conTexto.map(palabras).sort(function (a, b) { return a - b; });
    var mediana = largos[Math.floor(largos.length / 2)];

    function senal(txt, valor, clase) {
      var s = document.createElement('span');
      s.className = 'senal' + (clase ? ' ' + clase : '');
      var b = document.createElement('b');
      b.textContent = valor;
      s.appendChild(b);
      s.appendChild(document.createTextNode(' ' + txt));
      el.appendChild(s);
    }
    senal('respondieron', conTexto.length + '/' + datos.inscritos);
    if (nAus) senal('reportan que NO encontraron el dato', nAus, 'senal--aus');
    senal('se apoyan en una fuente', nFue);
    senal('palabras de mediana', mediana);
  }

  /* ── Aviso ──────────────────────────────────────────────────────── */
  function aviso(clase, titulo, texto, conCampo) {
    var el = $('aviso');
    el.style.display = 'block';
    el.className = 'aviso ' + (clase || '');
    el.textContent = '';
    var s = document.createElement('strong'); s.textContent = titulo; el.appendChild(s);
    el.appendChild(document.createTextNode(texto));
    if (!conCampo) return;

    var campoUrl = document.createElement('input');
    campoUrl.placeholder = 'URL /exec del Apps Script';
    campoUrl.value = ENDPOINT;
    var campoTok = document.createElement('input');
    campoTok.placeholder = 'DASH_TOKEN';
    campoTok.value = DASH;
    campoTok.type = 'password';
    var boton = document.createElement('button');
    boton.textContent = 'Conectar';
    boton.onclick = function () {
      ENDPOINT = campoUrl.value.trim();
      DASH = campoTok.value.trim();
      if (ENDPOINT && DASH) cargar();
    };
    el.appendChild(campoUrl);
    el.appendChild(campoTok);
    el.appendChild(boton);
  }

  /* ── Carga ──────────────────────────────────────────────────────── */
  function cargar() {
    if (!ENDPOINT || !DASH) {
      aviso('', 'Falta la conexión.',
        ' No se encontró config.js con la URL y el token de lectura. Escríbalos aquí — no se guardan.',
        true);
      return;
    }
    $('aviso').style.display = 'none';
    $('cuentas').textContent = 'cargando…';

    var url = ENDPOINT + '?action=tablero&dash=' + encodeURIComponent(DASH) +
              '&sesion=' + encodeURIComponent(sesion) + '&t=' + Date.now();
    fetch(url)
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.ok) {
          datos = null;
          $('cuentas').textContent = '—';
          aviso('aviso--malo', 'El servidor rechazó la consulta.',
            d.error === 'no_autorizado'
              ? ' El DASH_TOKEN no es correcto. Está en Apps Script → Configuración del proyecto → Propiedades del script.'
              : ' ' + (d.error || 'error desconocido') + '.',
            d.error === 'no_autorizado');
          pintarPreguntas(); pintarRespuestas();
          return;
        }
        datos = d;
        if (d.preguntas.length && (!preguntaActiva || d.preguntas.indexOf(preguntaActiva) === -1)) {
          preguntaActiva = d.preguntas[0];
        }
        $('cuentas').textContent = d.entregas + '/' + d.inscritos + ' entregas';
        pintarFaltantes(); pintarPreguntas(); pintarRespuestas();
      })
      .catch(function () {
        $('cuentas').textContent = '—';
        aviso('aviso--malo', 'No se pudo conectar.',
          ' Revise la conexión y la URL del despliegue.', true);
      });
  }

  /* ── Pintado ────────────────────────────────────────────────────── */
  function pintarFaltantes() {
    var el = $('faltantes');
    if (!datos || !datos.faltantes || !datos.faltantes.length) { el.style.display = 'none'; return; }
    el.style.display = 'block';
    el.textContent = '';
    var h = document.createElement('h2');
    h.textContent = 'Sin entregar · ' + datos.faltantes.length;
    el.appendChild(h);
    var ul = document.createElement('ul');
    datos.faltantes.forEach(function (p) {
      var li = document.createElement('li');
      li.textContent = p.nombre || p.correo;
      ul.appendChild(li);
    });
    el.appendChild(ul);
  }

  function pintarPreguntas() {
    var cont = $('preguntas');
    cont.textContent = '';
    if (!datos || !datos.preguntas.length) return;

    datos.preguntas.forEach(function (id) {
      var conCuantas = datos.respuestas.filter(function (r) {
        return String(r.respuestas[id] || '').trim();
      }).length;
      var b = document.createElement('button');
      b.textContent = id.toUpperCase();
      var n = document.createElement('span');
      n.className = 'n';
      n.textContent = conCuantas;
      b.appendChild(n);
      if (id === preguntaActiva) b.className = 'activa';
      b.onclick = function () { preguntaActiva = id; pintarPreguntas(); pintarRespuestas(); };
      cont.appendChild(b);
    });
  }

  function pintarRespuestas() {
    var cont = $('respuestas');
    cont.textContent = '';

    $('senales').textContent = '';
    $('citas').style.display = 'none';
    if (!datos) { $('titulo').textContent = '—'; $('subtitulo').textContent = ''; return; }
    if (!datos.entregas) {
      $('titulo').textContent = 'Todavía no hay entregas';
      $('subtitulo').textContent = datos.inscritos + ' estudiante(s) en el roster de ' + datos.sesion + '.';
      return;
    }

    var titulos = TITULOS[datos.sesion] || {};
    $('titulo').textContent = titulos[preguntaActiva] || preguntaActiva.toUpperCase();
    var marcadas = leidas();
    var conTexto = datos.respuestas.filter(function (r) { return String(r.respuestas[preguntaActiva] || '').trim(); });
    $('subtitulo').textContent =
      conTexto.length + ' de ' + datos.entregas + ' respondieron esta pregunta · ' +
      datos.sesion + ' · ' + datos.titulo;
    pintarSenales();
    pintarCitas();
    pintarIA();
    pintarGrupo();

    datos.respuestas.forEach(function (r) {
      var texto = String(r.respuestas[preguntaActiva] || '').trim();
      var idMarca = r.seudonimo + '|' + preguntaActiva;

      var t = document.createElement('article');
      t.className = 'tarjeta' + (marcadas[idMarca] ? ' leida' : '');
      t.setAttribute('data-seudo', r.seudonimo);

      var cab = document.createElement('div');
      cab.className = 'tarjeta__cab';
      var s = document.createElement('span');
      s.className = 'seudo';
      s.textContent = r.seudonimo;
      cab.appendChild(s);
      var q = document.createElement('span');
      q.className = 'quien';
      q.textContent = r.nombre + ' · ' + r.correo;
      cab.appendChild(q);
      var m = document.createElement('button');
      m.className = 'marca';
      m.textContent = marcadas[idMarca] ? 'discutida' : 'marcar';
      m.onclick = function () { alternarMarca(idMarca); };
      cab.appendChild(m);
      t.appendChild(cab);

      var p = document.createElement('p');
      if (texto) {
        p.className = 'tarjeta__txt';
        p.appendChild(resaltar(texto));
      } else {
        p.className = 'tarjeta__txt vacia';
        p.textContent = 'Sin responder';
      }
      t.appendChild(p);

      // Las respuestas largas llegan plegadas: ocho abiertas a la vez no se
      // leen. Se despliega la que se va a discutir.
      if (palabras(texto) > LIMITE_PLEGADO) {
        p.classList.add('plegado');
        var abrir = document.createElement('button');
        abrir.className = 'desplegar';
        abrir.textContent = 'Desplegar · ' + palabras(texto) + ' palabras';
        abrir.onclick = function () {
          var plegado = p.classList.toggle('plegado');
          abrir.textContent = plegado ? 'Desplegar · ' + palabras(texto) + ' palabras' : 'Plegar';
        };
        t.appendChild(abrir);
      }

      var pie = document.createElement('p');
      pie.className = 'tarjeta__pie';
      pie.textContent = 'v' + r.version + ' · ' + r.timestamp +
        (r.minutos ? ' · ' + r.minutos + ' min' : '') +
        (r.declaracionIA ? ' · declaró IA' : '');
      t.appendChild(pie);

      cont.appendChild(t);
    });
  }


  /* ── Síntesis con Ollama, en local ────────────────────────────────
     Los prompts, los lectores y la verificación de citas viven en
     _shared/sintesis-ia.js, compartidos con scripts/resumir-entregas.js.
     Aquí solo se pide, se pinta y se decide qué se proyecta.

     Dos productos, y solo uno se proyecta:

       · RESUMEN POR RESPUESTA (botón «Resumen por respuesta»): siete campos
         sobre lo que escribió cada persona. Vive en la memoria de esta
         pestaña y el modo proyección lo oculta siempre.
       · SÍNTESIS DEL GRUPO (botón «Síntesis del grupo» o tecla S): todas las
         respuestas de una pregunta en ideas sin autor. Esta sí se proyecta,
         como en el tablero de Investigación en CP y Rehabilitación. Se
         guarda en este navegador para poder prepararla antes de clase, y
         hay que LEERLA antes de proyectarla: el modo proyección esconde
         cualquier línea que repita un nombre propio de las respuestas, pero
         esa red no sustituye la lectura.

     Las reglas de siempre siguen en pie: el modelo corre en este equipo y
     las respuestas no salen de aquí; la cita se verifica contra el original
     carácter a carácter, y si no aparece literal se descarta.             */
  var IA = window.SintesisIA || null;
  var OLLAMA_URL = CFG.ollamaURL || 'http://localhost:11434';
  var OLLAMA_MODELO = CFG.ollamaModelo || (IA ? IA.MODELO_POR_DEFECTO : 'qwen3.5:9b');
  var sintesis = {};          // resumen por respuesta · { 'S04|p1': {...} } · solo en memoria
  var corriendo = false, cancelar = false;

  function claveIA() { return sesion + '|' + preguntaActiva; }
  function tituloDe(q) { return (TITULOS[sesion] || {})[q] || q.toUpperCase(); }

  function pedirAOllama(prompt, tipo) {
    return fetch(OLLAMA_URL + '/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(IA.peticion(OLLAMA_MODELO, prompt, tipo))
    }).then(function (r) {
      if (!r.ok) throw new Error('Ollama respondió ' + r.status);
      return r.json();
    }).then(function (j) { return j.response || ''; });
  }

  // Desde la copia local (file://) Ollama contesta sin OLLAMA_ORIGINS. Desde
  // la página publicada en HTTPS el navegador bloquea http://localhost por
  // contenido mixto, y en silencio.
  function motivoSinOllama() {
    if (!IA) return 'Falta _shared/sintesis-ia.js junto al tablero: sin él no hay síntesis.';
    return location.protocol === 'https:'
      ? 'El navegador bloquea http://localhost desde una página HTTPS. Abra su copia local del tablero (doble clic en _shared/tablero.html).'
      : 'No responde Ollama en ' + OLLAMA_URL + '. Ábralo (ollama serve) y vuelva a intentarlo.';
  }

  /* ── Resumen por respuesta · nunca se proyecta ───────────────────── */
  function pintarIA() {
    var el = $('ollama');
    var d = sintesis[claveIA()];
    if (!d) { el.hidden = true; el.textContent = ''; return; }
    el.hidden = false;
    el.textContent = '';

    var h = document.createElement('h2');
    h.textContent = 'Resumen por respuesta · borrador de máquina';
    var rehacer = document.createElement('button');
    rehacer.textContent = corriendo ? 'Detener' : 'Rehacer';
    rehacer.onclick = function () { corriendo ? (cancelar = true) : resumirPregunta(true); };
    var ocultar = document.createElement('button');
    ocultar.textContent = 'Descartar';
    ocultar.onclick = function () { delete sintesis[claveIA()]; pintarIA(); };
    h.appendChild(rehacer);
    if (!corriendo) h.appendChild(ocultar);
    el.appendChild(h);

    var nota = document.createElement('p');
    nota.className = 'ollama__nota';
    nota.textContent = 'Lo escribió un modelo, no una persona: léalo antes de usarlo. Es sobre cada ' +
      'estudiante y por eso no se proyecta nunca; para el proyector está la «Síntesis del grupo». ' +
      'Las citas se verificaron contra el texto original. Unos diez segundos por respuesta.';
    el.appendChild(nota);

    var estado = document.createElement('p');
    estado.className = 'ollama__estado';
    estado.textContent = d.estado || (OLLAMA_MODELO + ' · ' + d.hora + ' · citas verificadas ' +
      d.verificadas + ' · descartadas ' + d.descartadas);
    el.appendChild(estado);

    d.fichas.forEach(function (f) {
      var art = document.createElement('div');
      art.className = 'ficha';
      var quien = document.createElement('p');
      quien.className = 'ficha__seudo';
      quien.textContent = f.seudonimo + ' · ' + f.palabras + ' palabras';
      art.appendChild(quien);

      if (f.error) {
        var er = document.createElement('p');
        er.className = 'descartada';
        er.textContent = 'No se pudo resumir: ' + f.error;
        art.appendChild(er);
      }
      IA.CAMPOS.forEach(function (c) {
        if (c[0] === 'cita' || !f.campos || !f.campos[c[0]]) return;
        var p = document.createElement('p');
        var e = document.createElement('span'); e.className = 'etq'; e.textContent = c[2];
        p.appendChild(e); p.appendChild(document.createTextNode(f.campos[c[0]]));
        art.appendChild(p);
      });
      if (f.cita) {
        var bq = document.createElement('blockquote');
        bq.textContent = '«' + f.cita + '»';
        art.appendChild(bq);
        var v = document.createElement('p');
        v.className = 'verificada';
        v.textContent = 'Cita verificada en el original · se puede fijar desde la tarjeta.';
        art.appendChild(v);
      } else if (f.citaPropuesta) {
        var dd = document.createElement('p');
        dd.className = 'descartada';
        dd.textContent = 'El modelo propuso una cita que no aparece literalmente en el texto. Descartada.';
        art.appendChild(dd);
      }
      el.appendChild(art);
    });
  }

  function resumirPregunta(rehacer) {
    if (corriendo) { cancelar = true; return; }
    if (!datos || !datos.entregas || !preguntaActiva) return;
    var clave = claveIA();
    if (sintesis[clave] && !rehacer) { pintarIA(); return; }
    var q = preguntaActiva;
    var conTexto = datos.respuestas.filter(function (r) { return String(r.respuestas[q] || '').trim(); });
    if (!conTexto.length) return;

    corriendo = true; cancelar = false;
    var acumulado = { fichas: [], verificadas: 0, descartadas: 0, hora: '', estado: 'comprobando Ollama…' };
    sintesis[clave] = acumulado;
    $('resumir').textContent = 'Deteniendo…';
    pintarIA();

    if (!IA) { acumulado.estado = motivoSinOllama(); terminar(clave); return; }
    fetch(OLLAMA_URL + '/api/version')
      .then(function (r) { return r.json(); })
      .then(function () { return siguiente(0); })
      .catch(function () { acumulado.estado = motivoSinOllama(); terminar(clave); });

    function siguiente(i) {
      if (cancelar || i >= conTexto.length) { terminar(clave); return Promise.resolve(); }
      var r = conTexto[i];
      var texto = String(r.respuestas[q]).trim();
      acumulado.estado = OLLAMA_MODELO + ' · ' + (i + 1) + ' de ' + conTexto.length +
        (i ? ' · unos diez segundos cada una' : ' · la primera tarda más: carga el modelo');
      $('resumir').textContent = 'Detener · ' + (i + 1) + '/' + conTexto.length;
      pintarIA();

      return pedirAOllama(IA.promptRespuesta(texto, tituloDe(q)), 'respuesta').then(function (salida) {
        var x = IA.parsearRespuesta(salida);
        var cita = IA.verificarCita(x.cita, texto);
        if (cita) acumulado.verificadas++;
        else if (x.cita) acumulado.descartadas++;
        acumulado.fichas.push({ seudonimo: r.seudonimo, palabras: palabras(texto),
          campos: x, cita: cita, citaPropuesta: x.cita });
      }).catch(function (err) {
        acumulado.fichas.push({ seudonimo: r.seudonimo, palabras: palabras(texto),
          error: String(err && err.message || err) });
      }).then(function () { return siguiente(i + 1); });
    }

    function terminar(k) {
      corriendo = false;
      $('resumir').textContent = 'Resumen por respuesta';
      var d = sintesis[k];
      if (!d) { pintarIA(); return; }
      d.hora = new Date().toLocaleTimeString('es-CO');
      if (d.fichas.length) d.estado = '';
      if (cancelar && d.fichas.length) {
        d.estado = OLLAMA_MODELO + ' · detenido en ' + d.fichas.length + ' de ' +
          conTexto.length + ' · citas verificadas ' + d.verificadas + ' · descartadas ' + d.descartadas;
      }
      pintarIA();
    }
  }

  /* ── Síntesis del grupo · se proyecta ────────────────────────────────
     Se guarda en este navegador —solo la que salió bien— para poder
     prepararla antes de clase y leerla. No sale de este equipo.         */
  var grupo = {};
  function claveGrupo() { return 'SEM_CP_tablero_sintesis_grupo_' + sesion; }

  /* La síntesis que el script dejó junto al guion (_shared/PRIVADO_sintesis-
     grupo-SNN.js). Es la que el docente leyó, así que es la que se proyecta
     mientras no la rehaga aquí. No existe en el sitio publicado: el prefijo
     PRIVADO_ la deja fuera de git, y si falta no pasa nada. */
  function preparadaDe(q) {
    var p = window.SINTESIS_GRUPO && window.SINTESIS_GRUPO[sesion];
    return p && p[q] ? p[q] : null;
  }
  function cargarPreparada() {
    if (window.SINTESIS_GRUPO && window.SINTESIS_GRUPO[sesion]) { pintarGrupo(); return; }
    var sc = document.createElement('script');
    sc.src = 'PRIVADO_sintesis-grupo-' + sesion + '.js';
    sc.onload = function () { pintarGrupo(); };
    sc.onerror = function () { /* no hay guion preparado para esta sesión */ };
    document.body.appendChild(sc);
  }
  function cargarGrupo() {
    try { grupo = JSON.parse(localStorage.getItem(claveGrupo()) || '{}'); } catch (err) { grupo = {}; }
  }
  function guardarGrupo() {
    var limpio = {};
    Object.keys(grupo).forEach(function (k) { if (grupo[k] && grupo[k].estado === 'ok') limpio[k] = grupo[k]; });
    try { localStorage.setItem(claveGrupo(), JSON.stringify(limpio)); } catch (err) { /* sin espacio */ }
  }
  function textosDe(q) {
    if (!datos || !datos.respuestas) return [];
    return datos.respuestas.map(function (r) { return String(r.respuestas[q] || '').trim(); })
      .filter(function (t) { return t; });
  }

  function sintetizarGrupo(q) {
    var textos = textosDe(q);
    if (!textos.length) return Promise.resolve();
    if (!IA) { grupo[q] = { estado: 'error', msg: motivoSinOllama() }; pintarGrupo(); return Promise.resolve(); }
    grupo[q] = { estado: 'cargando' };
    pintarGrupo();
    return pedirAOllama(IA.promptGrupo(textos, tituloDe(q)), 'grupo')
      .then(function (salida) {
        var res = IA.parsearGrupo(salida, textos);
        res.estado = res.ideas.length ? 'ok' : 'error';
        res.cuando = new Date().toLocaleString('es-CO');
        res.n = textos.length;
        res.modelo = OLLAMA_MODELO;
        if (res.estado === 'error') res.msg = 'El modelo no devolvió el formato esperado. Vuelva a intentarlo.';
        grupo[q] = res;
        guardarGrupo();
        pintarGrupo();
      })
      .catch(function () { grupo[q] = { estado: 'error', msg: motivoSinOllama() }; pintarGrupo(); });
  }

  function sintetizarSesionGrupo() {
    if (!datos || !datos.preguntas) return;
    var cola = datos.preguntas.slice();
    (function siguiente() {
      if (!cola.length) return;
      var q = cola.shift();
      if (grupo[q] && grupo[q].estado === 'ok') return siguiente();
      sintetizarGrupo(q).then(siguiente);
    })();
  }

  var BLOQUES = [['acuerdo', 'Coinciden en'], ['tension', 'Tensión para discutir'],
                 ['fuentes', 'Fuentes que citan'], ['vacio', 'Nadie menciona'],
                 ['preguntas', 'Para devolver al grupo']];

  function textoGrupo(q) {
    var res = grupo[q] || {}, L = [tituloDe(q), ''];
    (res.ideas || []).forEach(function (id) {
      L.push('- ' + id.texto + (id.apoyos ? ' (≈ ' + id.apoyos + ' de ' + res.n + ')' : ''));
    });
    BLOQUES.forEach(function (b) { if (res[b[0]]) L.push('', b[1] + ': ' + res[b[0]]); });
    (res.citas || []).forEach(function (c) { L.push('«' + c + '»'); });
    return L.join('\n');
  }

  // Añade la marca de nombre propio y la clase que lo esconde al proyectar.
  function marcarNombres(nodo, texto, nombres) {
    var n = IA ? IA.nombresEn(texto, nombres) : [];
    if (!n.length) return 0;
    nodo.classList.add('no-proyectar');
    var b = document.createElement('span');
    b.className = 'sg-nombre';
    b.textContent = 'no se proyecta · ' + n.join(', ');
    nodo.appendChild(b);
    return 1;
  }

  function pintarGrupo() {
    var cont = $('sintesis');
    cont.textContent = '';
    if (!datos || !datos.entregas || !preguntaActiva) return;
    var q = preguntaActiva, textos = textosDe(q), res = grupo[q] || preparadaDe(q);

    var acc = document.createElement('div');
    acc.className = 'sg-acciones';
    var b1 = document.createElement('button');
    b1.type = 'button';
    b1.textContent = (res && res.estado === 'ok') ? 'Rehacer esta pregunta' : 'Sintetizar esta pregunta';
    b1.onclick = function () { sintetizarGrupo(q); };
    acc.appendChild(b1);
    var b2 = document.createElement('button');
    b2.type = 'button'; b2.className = 'otra';
    b2.textContent = 'Sintetizar toda la sesión';
    b2.onclick = sintetizarSesionGrupo;
    acc.appendChild(b2);
    if (res && res.estado === 'ok') {
      var b3 = document.createElement('button');
      b3.type = 'button'; b3.className = 'otra';
      b3.textContent = 'Copiar';
      b3.onclick = function () {
        if (navigator.clipboard) navigator.clipboard.writeText(textoGrupo(q)).then(function () { b3.textContent = 'Copiada'; });
      };
      acc.appendChild(b3);
    }
    cont.appendChild(acc);

    function espera(txt, proyectable) {
      var p = document.createElement('p');
      p.className = 'sg-espera' + (proyectable ? '' : ' no-proyectar');
      p.textContent = txt;
      cont.appendChild(p);
    }
    if (!textos.length) { espera('Nadie respondió esta pregunta.', true); return; }
    if (!res) {
      espera('Todavía no hay síntesis de esta pregunta. Pulse «Sintetizar esta pregunta» —unos quince ' +
        'segundos— o prepare toda la sesión antes de clase, y léala antes de proyectarla.', false);
      return;
    }
    if (res.estado === 'cargando') { espera('Agrupando las ' + textos.length + ' respuestas con ' + OLLAMA_MODELO + ', en este equipo…', true); return; }
    if (res.estado === 'error') { espera(res.msg || 'No se pudo generar la síntesis.', false); return; }

    var nombres = IA ? IA.nombresDelGrupo(textos) : [];
    var marcadas = 0;

    var ul = document.createElement('ul');
    ul.className = 'sg-ideas';
    res.ideas.forEach(function (id) {
      var li = document.createElement('li');
      li.className = 'sg-idea';
      li.appendChild(document.createTextNode(id.texto));
      if (id.apoyos) {
        var sp = document.createElement('span');
        sp.className = 'sg-peso';
        sp.title = 'Estimado por el modelo, no contado';
        sp.textContent = '≈ ' + id.apoyos + ' de ' + res.n;
        li.appendChild(sp);
      }
      marcadas += marcarNombres(li, id.texto, nombres);
      ul.appendChild(li);
    });
    cont.appendChild(ul);

    BLOQUES.forEach(function (b) {
      if (!res[b[0]]) return;
      var d = document.createElement('div');
      d.className = 'sg-bloque';
      var h = document.createElement('h3');
      h.textContent = b[1];
      var p = document.createElement('p');
      p.textContent = res[b[0]];
      d.appendChild(h); d.appendChild(p);
      marcadas += marcarNombres(d, res[b[0]], nombres);
      cont.appendChild(d);
    });

    var verificadas = res.origen === 'guion' ? res.citasVerificadas : (res.citas && res.citas.length);
    var citas = (res.citas && res.citas.length) ? res.citas : (IA ? IA.citasDeRespaldo(textos, nombres) : []);
    if (citas.length) {
      var dc = document.createElement('div');
      dc.className = 'sg-bloque';
      var hc = document.createElement('h3');
      hc.textContent = verificadas ? 'En sus palabras · verificadas, sin autor'
                                   : 'En sus palabras · frases tomadas de los textos, sin autor';
      dc.appendChild(hc);
      var uc = document.createElement('ul');
      uc.className = 'sg-citas';
      citas.forEach(function (c) {
        var li = document.createElement('li');
        li.textContent = '«' + c + '»';
        marcadas += marcarNombres(li, c, nombres);
        uc.appendChild(li);
      });
      dc.appendChild(uc);
      cont.appendChild(dc);
    }

    // Si llegaron entregas después de prepararla, la síntesis ya no es del
    // grupo entero: se avisa, y fuera de la proyección.
    if (res.n && res.n !== textos.length) {
      var desfase = document.createElement('p');
      desfase.className = 'sg-espera no-proyectar';
      desfase.textContent = '⚠️ Se preparó con ' + res.n + ' respuestas y ahora hay ' + textos.length +
        '. Rehágala («Rehacer esta pregunta») o vuelva a correr el guion antes de proyectarla.';
      cont.insertBefore(desfase, cont.children[1] || null);
    }

    var meta = document.createElement('p');
    meta.className = 'sg-meta';
    meta.textContent = (res.origen === 'guion' ? 'Preparada en el guion (' + (res.cuando || '') + '): es la que usted leyó. ' : '') +
      'Borrador de máquina (' + (res.modelo || OLLAMA_MODELO) + ') sobre ' + res.n +
      ' respuestas · ' + (res.cuando || '') + ' · léalo antes de proyectarlo. Las citas se comprobaron ' +
      'contra el texto original. Los respaldos «≈» los estima el modelo; las señales de arriba sí están contadas.' +
      (marcadas ? ' ' + marcadas + ' línea(s) repiten un nombre propio de las respuestas y el modo proyección las oculta.' : '');
    cont.appendChild(meta);
  }

  function alternarVistaGrupo() {
    var on = document.body.classList.toggle('vista-sintesis');
    var b = $('vistaSintesis');
    b.classList.toggle('on', on);
    b.textContent = on ? 'Ver respuestas' : 'Síntesis del grupo';
    pintarGrupo();
  }

  /* ── Controles ──────────────────────────────────────────────────── */
  var escala = 1;
  function aplicarEscala() { document.documentElement.style.setProperty('--escala', escala.toFixed(2)); }
  $('mas').onclick   = function () { escala = Math.min(2.4, escala + 0.12); aplicarEscala(); };
  $('menos').onclick = function () { escala = Math.max(0.8, escala - 0.12); aplicarEscala(); };
  $('recargar').onclick = cargar;
  $('resumir').onclick = function () { resumirPregunta(false); };
  $('vistaSintesis').onclick = alternarVistaGrupo;
  $('proyeccion').onclick = function () {
    var on = document.body.classList.toggle('proyeccion');
    this.classList.toggle('on', on);
    this.textContent = on ? 'Proyección ACTIVA' : 'Modo proyección';
  };
  $('sesion').onchange = function () {
    sesion = this.value;
    preguntaActiva = null;
    cargarGrupo();
    cargarPreparada();
    history.replaceState(null, '', '?sesion=' + sesion);
    cargar();
  };

  // Flechas para pasar de pregunta sin soltar el puntero del proyector.
  document.addEventListener('keydown', function (e) {
    if (!datos || !datos.preguntas.length) return;
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    var i = datos.preguntas.indexOf(preguntaActiva);
    if (e.key === 'ArrowRight' && i < datos.preguntas.length - 1) { preguntaActiva = datos.preguntas[i + 1]; pintarPreguntas(); pintarRespuestas(); }
    if (e.key === 'ArrowLeft'  && i > 0)                          { preguntaActiva = datos.preguntas[i - 1]; pintarPreguntas(); pintarRespuestas(); }
    if (e.key === 's' || e.key === 'S') alternarVistaGrupo();
  });

  cargarGrupo();
  cargarPreparada();
  cargar();
})();
</script>
</html>
